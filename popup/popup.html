<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Share Viewer settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <img src="../assets/icon.png" alt="" width="28" height="28">
    <div>
      <h1>Return Facebook Share Viewer</h1>
      <p class="muted" id="version"></p>
    </div>
  </header>

  <main>
    <section aria-labelledby="h-links">
      <h2 id="h-links">Share links</h2>
      <label class="row">
        <span class="text">
          <span class="name">Show share links on Facebook</span>
          <span class="desc">Off stops the extension from reading Facebook's responses or adding links.</span>
        </span>
        <input type="checkbox" role="switch" data-key="enabled">
      </label>
    </section>

    <section aria-labelledby="h-updates">
      <h2 id="h-updates">Updates</h2>
      <div class="update">
        <p id="update-status" aria-live="polite">Loading…</p>
        <button type="button" id="check-now">Check now</button>
      </div>
      <label class="row">
        <span class="text">
          <span class="name">Check GitHub once a day</span>
          <span class="desc">Shows NEW on the toolbar icon when a release is out. You still install it by hand.</span>
        </span>
        <input type="checkbox" role="switch" data-key="updateCheck">
      </label>
    </section>

    <section aria-labelledby="h-debug">
      <h2 id="h-debug">Debugging</h2>
      <label class="row">
        <span class="text">
          <span class="name">Debug logging</span>
          <span class="desc">Logs <code>[FBSR]</code> lines to the page console and keeps the last 50 GraphQL responses in <code>window.__feedBodies</code>.</span>
        </span>
        <input type="checkbox" role="switch" data-key="debug">
      </label>
      <label class="row">
        <span class="text">
          <span class="name">Skip inline-script seeding</span>
          <span class="desc">Ignores the posts Facebook renders into the first page load. Use it to isolate a bug.</span>
        </span>
        <input type="checkbox" role="switch" data-key="disableSeeding">
      </label>
    </section>
  </main>

  <footer class="notice" id="reload-notice" hidden>
    <p>Reload Facebook to apply.</p>
    <button type="button" id="reload-tabs">Reload Facebook tabs</button>
  </footer>
  <p class="error" id="error" role="alert" hidden></p>

  <script src="popup.js"></script>
</body>
</html>
