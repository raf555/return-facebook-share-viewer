<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Share Viewer settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <img src="../assets/icon.png" alt="" width="28" height="28">
    <div>
      <h1>Return Facebook Share Viewer</h1>
      <p class="muted" id="version"></p>
    </div>
    <a class="repo" href="https://github.com/raf555/return-facebook-share-viewer" target="_blank" rel="noreferrer" aria-label="Source code on GitHub" title="Source code on GitHub">
      <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
    </a>
  </header>

  <main>
    <section aria-labelledby="h-links">
      <h2 id="h-links">Share links</h2>
      <label class="row">
        <span class="text">
          <span class="name">Show share links on Facebook</span>
          <span class="desc">Off stops reading responses and adding links.</span>
        </span>
        <input type="checkbox" role="switch" data-key="enabled">
      </label>
      <label class="row">
        <span class="text">
          <span class="name">Preview sharers on hover</span>
          <span class="desc">Off skips the hover list and its API call. Click still works.</span>
        </span>
        <input type="checkbox" role="switch" data-key="hoverPreview">
      </label>
    </section>

    <section aria-labelledby="h-updates">
      <h2 id="h-updates">Updates</h2>
      <div class="update">
        <p id="update-status" aria-live="polite">Loading…</p>
        <button type="button" id="check-now">Check now</button>
      </div>
      <label class="row">
        <span class="text">
          <span class="name">Check GitHub once a day</span>
          <span class="desc">Shows UPD on the toolbar icon when a release is out.</span>
        </span>
        <input type="checkbox" role="switch" data-key="updateCheck">
      </label>
    </section>

    <details class="debug" id="debug-panel">
      <summary><h2>Debugging</h2></summary>
      <div class="update">
        <p id="log-status" aria-live="polite">Loading…</p>
        <button type="button" id="copy-debug">Copy debug info</button>
      </div>
      <label class="row">
        <span class="text">
          <span class="name">Debug logging</span>
          <span class="desc">Console logs, plus responses in <code>window.__feedBodies</code>.</span>
        </span>
        <input type="checkbox" role="switch" data-key="debug">
      </label>
      <label class="row">
        <span class="text">
          <span class="name">Skip inline-script seeding</span>
          <span class="desc">Ignores posts rendered into the first page load.</span>
        </span>
        <input type="checkbox" role="switch" data-key="disableSeeding">
      </label>
    </details>
  </main>

  <footer class="notice" id="reload-notice" hidden>
    <p>Reload Facebook to apply.</p>
    <button type="button" id="reload-tabs">Reload Facebook tabs</button>
  </footer>
  <p class="error" id="error" role="alert" hidden></p>

  <script src="popup.js"></script>
</body>
</html>
